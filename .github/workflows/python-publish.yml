name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Verify tag matches project version
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]

          actual = os.environ["RELEASE_TAG"]
          expected = f"v{version}"
          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} does not match project version {expected!r}"
              )

  build:
    name: Build distribution
    needs: [test, verify-version]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          distributions = sorted(path for path in Path("dist").iterdir() if path.is_file())
          wheels = [path for path in distributions if path.suffix == ".whl"]
          sdists = [path for path in distributions if path.name.endswith(".tar.gz")]
          if len(wheels) != 1 or len(sdists) != 1 or len(distributions) != 2:
              raise SystemExit(
                  "Expected exactly one wheel and one source distribution; found: "
                  + ", ".join(path.name for path in distributions)
              )

          subprocess.run(
              [sys.executable, "-m", "twine", "check", "--strict", *distributions],
              check=True,
          )

      - name: Install and smoke-test wheel in isolation
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tomllib
          import venv
          from pathlib import Path
          from textwrap import dedent

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel; found {len(wheels)}")

          with Path("pyproject.toml").open("rb") as file:
              expected_version = tomllib.load(file)["project"]["version"]

          environment = Path(os.environ["RUNNER_TEMP"]) / "wheel-smoke-test"
          venv.EnvBuilder(with_pip=True, clear=True).create(environment)
          python = environment / "bin" / "python"
          subprocess.run(
              [
                  python,
                  "-m",
                  "pip",
                  "install",
                  "--no-deps",
                  "--no-index",
                  wheels[0].resolve(),
              ],
              cwd=environment,
              check=True,
          )

          smoke_test = dedent(
              f"""
              from importlib.metadata import version
              from pypac_multiply import multiplier

              assert version("pypac-multiply") == {expected_version!r}
              assert multiplier(241) == "hentetracontadicta"
              assert multiplier(4, complex=True) == "tetrakis"
              """
          )
          subprocess.run(
              [python, "-I", "-c", smoke_test],
              cwd=environment,
              check=True,
          )

      - name: Store distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: pypi
      url: https://pypi.org/project/pypac-multiply/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
